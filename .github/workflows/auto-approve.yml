name: Auto Approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: (github.actor == 'google-labs-jules[bot]' || github.actor == 'creatiVision') && github.actor != 'github-actions[bot]'
    steps:
      - name: Approve pull request
        uses: hmarr/auto-approve-action@v4
        continue-on-error: true
        with:
          review-message: 'Auto-approved: green CI + automated PR from Jules/owner.'