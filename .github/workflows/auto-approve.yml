name: Auto Approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'creatiVision' && github.actor != github.event.pull_request.user.login
    steps:
      - name: Approve pull request
        uses: hmarr/auto-approve-action@v4
        with:
          review-message: 'Auto-approved: green CI + automated PR from owner.'
