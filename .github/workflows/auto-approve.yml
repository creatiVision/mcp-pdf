name: Auto Approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.actor == "google-labs-jules[bot]" || github.actor == "creatiVision"
    steps:
      - name: Approve pull request
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                event: "APPROVE",
                body: "Auto-approved: green CI + automated PR from Jules/owner."
              });
              console.log("Successfully approved pull request");
            } catch (error) {
              console.warn("Auto-approval skipped or failed:", error.message);
            }
